
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ecommerce_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./backend/database/user.sql:/docker-entrypoint-initdb.d/03-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ecommerce_user
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
      DB_NAME: ecommerce_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
